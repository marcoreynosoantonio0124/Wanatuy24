name: Reminders cron

# Hits the deployed /api/cron endpoint hourly to advance due dates and send
# reminders. Use this if you deploy somewhere without a built-in scheduler
# (or in addition to Vercel Cron). Configure two repo secrets:
#   APP_BASE_URL   e.g. https://your-app.vercel.app
#   CRON_SECRET    the same value set in the app's environment

on:
  schedule:
    - cron: "0 * * * *" # every hour, UTC
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron
        run: |
          code=$(curl -sS -o /tmp/out -w "%{http_code}" \
            -X POST "${APP_BASE_URL}/api/cron" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
